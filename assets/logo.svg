<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Civic League of Gulfport — gold chrysanthemum and green banner, Est. 1947">
  <defs>
    <radialGradient id="petalA" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="40%" stop-color="#ffd84a"/>
      <stop offset="85%" stop-color="#d29400"/>
      <stop offset="100%" stop-color="#8a6100"/>
    </radialGradient>
    <radialGradient id="petalB" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffefa0"/>
      <stop offset="50%" stop-color="#f5c000"/>
      <stop offset="100%" stop-color="#9a6800"/>
    </radialGradient>
    <radialGradient id="centerG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b400"/>
      <stop offset="100%" stop-color="#5a3a00"/>
    </radialGradient>
    <linearGradient id="bannerG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6b3a"/>
      <stop offset="50%" stop-color="#15522b"/>
      <stop offset="100%" stop-color="#0e3a1e"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd84a"/>
      <stop offset="100%" stop-color="#b08400"/>
    </linearGradient>
  </defs>

  <!-- Outer rings: cream face, blue & gold borders -->
  <circle cx="120" cy="120" r="118" fill="#fdf8ea"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="url(#ringG)" stroke-width="3"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#1a3a6b" stroke-width="3"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#ringG)" stroke-width="1.5"/>

  <!-- Chrysanthemum -->
  <g transform="translate(120 108)">
    <!-- Leaves -->
    <path d="M-78 22 Q-90 0 -70 -10 Q-50 -2 -42 18 Q-60 28 -78 22 Z" fill="#1f6b3a" opacity="0.85"/>
    <path d="M78 22 Q90 0 70 -10 Q50 -2 42 18 Q60 28 78 22 Z" fill="#1f6b3a" opacity="0.85"/>
    <path d="M-78 22 Q-90 0 -70 -10 Q-50 -2 -42 18 Q-60 28 -78 22 Z" fill="none" stroke="#0e3a1e" stroke-width="1"/>
    <path d="M78 22 Q90 0 70 -10 Q50 -2 42 18 Q60 28 78 22 Z" fill="none" stroke="#0e3a1e" stroke-width="1"/>

    <!-- Outer petal ring -->
    <g>
      <ellipse transform="rotate(0)"    cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(22.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(45)"   cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(67.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(90)"   cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(112.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(135)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(157.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(180)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(202.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(225)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(247.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(270)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(292.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(315)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
      <ellipse transform="rotate(337.5)" cx="0" cy="-62" rx="10" ry="26" fill="url(#petalA)" stroke="#9a6800" stroke-width="0.6"/>
    </g>

    <!-- Middle petal ring (rotated, slightly smaller) -->
    <g transform="rotate(11)">
      <ellipse transform="rotate(0)"    cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(30)"   cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(60)"   cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(90)"   cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(120)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(150)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(180)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(210)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(240)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(270)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(300)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
      <ellipse transform="rotate(330)"  cx="0" cy="-42" rx="9" ry="22" fill="url(#petalB)" stroke="#9a6800" stroke-width="0.5" opacity="0.97"/>
    </g>

    <!-- Inner petals -->
    <g>
      <ellipse transform="rotate(0)"   cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(45)"  cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(90)"  cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(135)" cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(180)" cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(225)" cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(270)" cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
      <ellipse transform="rotate(315)" cx="0" cy="-22" rx="7" ry="14" fill="#ffd84a" stroke="#9a6800" stroke-width="0.4"/>
    </g>

    <!-- Center -->
    <circle cx="0" cy="-10" r="9" fill="url(#centerG)"/>
  </g>

  <!-- Green ribbon banner -->
  <g>
    <!-- Banner shadow -->
    <path d="M14 152 L226 152 L226 196 L120 200 L14 196 Z" fill="rgba(0,0,0,0.18)" transform="translate(0 3)"/>
    <!-- Banner body -->
    <path d="M14 150 L226 150 L226 194 L120 198 L14 194 Z" fill="url(#bannerG)"/>
    <!-- Banner gold edges -->
    <path d="M14 150 L226 150" stroke="#d2a200" stroke-width="2"/>
    <path d="M14 194 L120 198 L226 194" stroke="#d2a200" stroke-width="2" fill="none"/>
    <!-- Banner tails (left/right) -->
    <path d="M14 150 L2 162 L14 174 Z" fill="#0e3a1e"/>
    <path d="M226 150 L238 162 L226 174 Z" fill="#0e3a1e"/>
    <path d="M14 174 L4 174 L14 194 Z" fill="#0a2916"/>
    <path d="M226 174 L236 174 L226 194 Z" fill="#0a2916"/>

    <!-- Banner text -->
    <text x="120" y="173" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="700" fill="#fdf8ea" letter-spacing="1.2">CIVIC LEAGUE</text>
    <text x="120" y="190" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="13" font-weight="600" fill="#ffd84a" letter-spacing="3">— of —</text>
    <text x="120" y="190" opacity="0"></text>
  </g>

  <!-- "Gulfport" label below banner -->
  <text x="120" y="214" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="700" fill="#15522b" letter-spacing="2.5">GULFPORT</text>

  <!-- Est. 1947 -->
  <text x="120" y="228" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="9" font-weight="600" fill="#b08400" letter-spacing="3">— Est. 1947 —</text>
</svg>
